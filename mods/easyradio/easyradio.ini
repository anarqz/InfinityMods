; EasyRadio: which official stations play your own music. Read at every game start.
; The Infinity launcher's Mods page edits this file (EasyRadio > Settings); by hand works too, with the game closed.
; Comments start with ';' (or '#'); after a value they need a space before them.
;
; Each station plays a folder of MP3 files (ID3 tags give the title and artist; a logo.png, logo.jpg or logo.bmp in it
; becomes the station's HUD icon, any size, fitted into 196x96). The folder can be anywhere OUTSIDE this mod's folder,
; which an uninstall deletes: another drive, a USB stick, a network share, or <Azimuth>\EasyRadio\ (next to azimuth.exe).
; A folder that is not there at a game start (an unplugged drive) is skipped: that station plays its own songs.
; EasyRadio writes plugins\generated\, plugins\cache\ and EasyRadio.log in the mod's folder itself: do not edit them.
; This file is UTF-8. Changes apply at the next game start.

[radios]
; station = stock (keeps its own music), an absolute folder (D:\Music\party, \\nas\music\party, under Proton
; Z:\home\deck\Music\party), or a plain name: a folder of <Azimuth>\EasyRadio\ (then of this mod's folder), created
; empty at the next game start if missing; music1 to music8 are the names EasyRadio 1.1 offered. No quotes needed.
; The launcher's Choose folder... writes the absolute folder you pick; Clear writes stock.
; The station's name stays (the game keys unlocks and icons by it); its songs, HUD text and (with a logo) its
; icon change. Station ids: horizon (or pulse) = Horizon Pulse, bass = Bass Arena, xs = Horizon XS,
; levante = Radio Levante, hospital = Hospital Records, ninjatune = Ninja Tune, innovative = Innovative Leisure.
horizon=stock
bass=stock
xs=stock
levante=stock
hospital=stock
ninjatune=stock
innovative=stock

[options]
; dj: keep | off. keep: the station's own DJ lines and stingers play between your songs.
;     off: no DJ lines or stingers on the mapped stations (songs follow each other directly).
dj=keep
; skip_key: F1-F12 | off. Skips to the next song while the game window has the focus and a mapped station plays
;     one of your songs. (Extra Options uses F1-F4 by default.)
skip_key=F6
; skip_pad: A B X Y LB RB LS RS View Menu Up Down Left Right | off. A quick tap (under 0.4 s, alone) of this pad
;     button does the same. Note: in FH2 a left-stick click is also the horn.
skip_pad=LS
; game_folder=C:\Games\Forza Horizon 2   ; only if EasyRadio.log says the game's RadioInfo was not found
